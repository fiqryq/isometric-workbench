name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package tests
        working-directory: Packages/IsoKit
        run: swift test

      - name: App tests
        run: |
          xcodebuild test \
            -project isometric-workbench.xcodeproj \
            -scheme isometric-workbench \
            -destination 'platform=macOS' \
            -only-testing:isometric-workbenchTests \
            CODE_SIGNING_ALLOWED=NO
